name: Robô do EU QUERO

on:
  schedule:
    # A cada 10 minutos (o GitHub às vezes atrasa um pouco). Sem GitHub Pages, sem vídeo: leva segundos.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # guardar o estado (quem já recebeu o link) no ramo "dados"

concurrency:
  group: eu-quero
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Recuperar o estado
        run: |
          if git ls-remote --exit-code --heads origin dados >/dev/null; then
            git fetch --depth=1 origin dados
            git show FETCH_HEAD:estado.json > estado.json
          else
            codigo=$?
            # 2 = o ramo ainda não existe (primeira vez). Outro código é falha de rede: melhor parar do que começar sem histórico e mandar o link de novo a todo mundo.
            if [ "$codigo" -ne 2 ]; then echo "Não consegui consultar o ramo dados ($codigo)."; exit 1; fi
            echo '{}' > estado.json
          fi

      - name: Rodar o robô
        id: robo
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          LINK_DO_PLANO: https://flaviocoelhotoledo.systeme.io/30-dias-de-paz
          PALAVRAS: eu quero,quero,euquero
          # Dia em que o token foi gerado (o token vale 60 dias). Ao renovar, troque esta data: a página de monitoramento avisa antes de vencer.
          TOKEN_GERADO_EM: '2026-11-21'
        run: node robo.mjs

      - name: Guardar o estado
        # Roda mesmo se o robô falhou, para não esquecer quem já recebeu.
        if: always() && steps.robo.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pasta=$(mktemp -d)
          cp estado.json "$pasta/"
          # status.json é o resumo que a página de monitoramento lê (só números, sem nomes).
          [ -f status.json ] && cp status.json "$pasta/" || true
          cd "$pasta"
          git init -q -b dados
          git config user.name "vinde-a-mim-bot"
          git config user.email "vinde-a-mim-bot@users.noreply.github.com"
          git add estado.json
          [ -f status.json ] && git add status.json || true
          git commit -q -m "Estado do robô"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados
